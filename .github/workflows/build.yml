name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake autoconf automake libtool libcurl4-openssl-dev libicu-dev
      - name: lcdapi
        run: |
          git clone --depth 1 https://github.com/spdawson/lcdapi /tmp/lcdapi
          cd /tmp/lcdapi
          autoreconf -fi
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
      - name: Build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=MinSizeRel ..
          make -j"$(nproc)"
          ./slimmer --help
